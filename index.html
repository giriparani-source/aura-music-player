<!doctype html>
<html lang="en" class="dark" style="background-color: #0b0d13; color: #e2e8f0;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/music-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura Music" />
    <link rel="apple-touch-icon" href="/music-icon.svg" />
    <title>Aura Music | High-Fidelity Audio Player</title>
    <meta name="description" content="High-Fidelity Offline & Cloud Streaming Audio Player with AI Audio Suite, 3D Spatial Theatre & Realtime Karaoke." />
    <meta property="og:title" content="Aura Music Player" />
    <meta property="og:description" content="High-Fidelity Audio Player with AI DJ, 10-Band EQ, 3D Spatial Theatre, and Studio Master Streaming." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aura-music-player-omega.vercel.app/" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Clean up any stale service workers or caches on localhost to prevent blank screens
      if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
      }
    </script>
  </head>
  <body style="background-color: #0b0d13; color: #e2e8f0; margin: 0; min-height: 100vh;" class="bg-[#0b0d13] text-[#e2e8f0] antialiased selection:bg-indigo-500/30 selection:text-indigo-200 overflow-hidden font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0d13; color: #94a3b8; font-family: system-ui, -apple-system, sans-serif;">
        <div style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5, #9333ea); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4); margin-bottom: 20px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div style="width: 28px; height: 28px; border: 2.5px solid rgba(255,255,255,0.1); border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px;"></div>
        <p style="font-size: 13px; font-weight: 500; color: #94a3b8; margin: 0; letter-spacing: 0.02em;">Loading Aura Music...</p>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
